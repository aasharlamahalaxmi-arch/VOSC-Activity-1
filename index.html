<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Tic Tac Toe</h1>
        <p class="subtitle">A classic game of X and O</p>

        <div class="score-board">
            <div class="score x-score">
                <span>Player X</span>
                <strong id="scoreX">0</strong>
            </div>

            <div class="score draw-score">
                <span>Draws</span>
                <strong id="scoreDraw">0</strong>
            </div>

            <div class="score o-score">
                <span>Player O</span>
                <strong id="scoreO">0</strong>
            </div>
        </div>

        <div class="status" id="status">
            Player X's turn
        </div>

        <div class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>

        <div class="buttons">
            <button id="restartBtn">New Game</button>
            <button id="resetBtn" class="secondary">Reset Score</button>
        </div>

        <p class="footer">Made with ❤️ using HTML, CSS & JavaScript</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
